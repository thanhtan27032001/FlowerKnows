spring:
  application:
    name: flowerknows-blindbag

  datasource:
    url: jdbc:postgresql://localhost:5432/flowerknows_blindbag
    username: app
    password: app_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    com.gaden.flowerknows: DEBUG

app:
  low-stock-threshold: 5
  jwt:
    secret: ${JWT_SECRET:change-me-flowerknows-jwt-secret-key-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    owner-username: ${SEED_OWNER_USERNAME:}
    owner-password: ${SEED_OWNER_PASSWORD:}
    owner-full-name: ${SEED_OWNER_FULL_NAME:}
