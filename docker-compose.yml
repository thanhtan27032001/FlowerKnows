version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flowerknows_blindbag
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowerknows_blindbag
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app_password
    ports:
      - "8080:8080"

  adminer:
    image: adminer
    depends_on:
      - postgres
    ports:
      - "8081:8080"

volumes:
  pgdata: